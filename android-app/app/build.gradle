def prepareDebugTestAssets = tasks.register("prepareDebugTestAssets") {
    outputs.dir(generatedDebugTestAssets)
    outputs.upToDateWhen { false }
    doLast {
        File outputRoot = generatedDebugTestAssets.get().asFile
        delete(outputRoot)

        List<File> candidates = []
        if (configuredNgs2Module.isPresent()) {
            candidates.add(file(configuredNgs2Module.get()))
        }
        candidates.addAll([
                rootProject.file("../../executor-shadps4-lab/user/sys_modules/libSceNgs2.sprx"),
                rootProject.file("../../PS4Run/user/sys_modules/libSceNgs2.sprx"),
                rootProject.file("../../refs/PS4Run/shadps4-pc-v016-reference/user/sys_modules/libSceNgs2.sprx")
        ])

        File source = candidates.find { it.isFile() }
        if (source == null) {
            logger.lifecycle("LSX4 debug test mode: libSceNgs2.sprx was not found in the " +
                    "configured shad4pc sys_modules path; the debug APK will expose the " +
                    "test-mode control but cannot install the optional module. Set " +
                    "-Pshad4pcNgs2Module=<path> or SHAD4PC_NGS2_MODULE.")
            return
        }

        copy {
            from(source)
            into(new File(outputRoot, "test_mode"))
            rename { "libSceNgs2.sprx" }
        }
        logger.lifecycle("LSX4 debug test mode: packaged NGS2 module from ${source}")
    }
}

def buildSwanstationAndroid = tasks.register("buildSwanstationAndroid") {
    inputs.property("commit", swanstationCommit)
    inputs.property("sourceDateEpoch", swanstationSourceDateEpoch)
    inputs.property("androidAbi", "arm64-v8a")
    inputs.property("androidPlatform", "android-26")
    inputs.property("ndkVersion", swanstationNdkVersion)
    inputs.property("cmakeVersion", swanstationCmakeVersion)
    inputs.files(fileTree(swanstationSource) {
        exclude ".git", ".git/**", "src/libretro/version.h"
    })
    outputs.file(swanstationCore)
    // Re-run the cheap configure/pin gate for every APK build. File inputs alone cannot
    // distinguish two revisions with identical checked-out contents.
    outputs.upToDateWhen { false }

    doLast {
        File sourceCmake = new File(swanstationSource, "CMakeLists.txt")
        if (!sourceCmake.isFile()) {
            throw new GradleException(
                    "Pinned SwanStation source is missing; initialize externals/swanstation: ${swanstationSource}")
        }

        ByteArrayOutputStream gitOutput = new ByteArrayOutputStream()
        project.exec {
            commandLine("git", "-C", swanstationSource.absolutePath, "rev-parse", "HEAD")
            standardOutput = gitOutput
        }
        String actualCommit = gitOutput.toString("UTF-8").trim()
        if (actualCommit != swanstationCommit) {
            throw new GradleException(
                    "SwanStation source revision mismatch: expected ${swanstationCommit}, got ${actualCommit}")
        }
        ByteArrayOutputStream gitStatusOutput = new ByteArrayOutputStream()
        project.exec {
            commandLine("git", "-C", swanstationSource.absolutePath,
                    "status", "--porcelain", "--untracked-files=normal")
            standardOutput = gitStatusOutput
        }
        String trackedChanges = gitStatusOutput.toString("UTF-8").trim()
        if (!trackedChanges.isEmpty()) {
            throw new GradleException(
                    "Pinned SwanStation source has tracked local changes: ${trackedChanges}")
        }

        String executableSuffix = System.getProperty("os.name")
                .toLowerCase(Locale.ROOT).contains("windows") ? ".exe" : ""
        File sdkRoot = android.sdkDirectory
        File ndkRoot = new File(sdkRoot, "ndk/${swanstationNdkVersion}")
        File cmakeRoot = new File(sdkRoot, "cmake/${swanstationCmakeVersion}")
        File cmakeExecutable = new File(cmakeRoot, "bin/cmake${executableSuffix}")
        File ninjaExecutable = new File(cmakeRoot, "bin/ninja${executableSuffix}")
        File toolchain = new File(ndkRoot, "build/cmake/android.toolchain.cmake")
        for (File required : [cmakeExecutable, ninjaExecutable, toolchain]) {
            if (!required.isFile()) {
                throw new GradleException(
                        "SwanStation Android build tool is missing: ${required}")
            }
        }

        swanstationBuild.mkdirs()
        Map<String, String> deterministicEnvironment = [
                SOURCE_DATE_EPOCH: swanstationSourceDateEpoch,
                ZERO_AR_DATE     : "1"
        ]
        project.exec {
            environment(deterministicEnvironment)
            commandLine(cmakeExecutable.absolutePath,
                    "-S", swanstationSource.absolutePath,
                    "-B", swanstationBuild.absolutePath,
                    "-G", "Ninja",
                    "-DCMAKE_MAKE_PROGRAM=${ninjaExecutable.absolutePath}",
                    "-DCMAKE_TOOLCHAIN_FILE=${toolchain.absolutePath}",
                    "-DANDROID_ABI=arm64-v8a",
                    "-DANDROID_PLATFORM=android-26",
                    "-DANDROID_STL=c++_shared",
                    "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                    "-DCMAKE_BUILD_TYPE=Release")
        }
        project.exec {
            environment(deterministicEnvironment)
            commandLine(cmakeExecutable.absolutePath,
                    "--build", swanstationBuild.absolutePath,
                    "--target", "swanstation_libretro",
                    "--parallel")
        }
        if (!swanstationCore.isFile() || swanstationCore.length() <= 0L) {
            throw new GradleException(
                    "SwanStation Android build did not produce ${swanstationCore}")
        }
        logger.lifecycle("LSX4 PS1 core built from ${swanstationCommit}: ${swanstationCore}")
    }
}

def buildAdrenoToolsAndroid = tasks.register("buildAdrenoToolsAndroid") {
    inputs.property("commit", adrenoToolsCommit)
