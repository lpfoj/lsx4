[constants]
ndk = '/opt/android-sdk/ndk/27.2.12479018'
toolchain = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/bin'

[binaries]
c = toolchain / 'aarch64-linux-android26-clang'
cpp = [toolchain / 'aarch64-linux-android26-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '--start-no-unused-arguments', '-static-libstdc++', '--end-no-unused-arguments']
ar = toolchain / 'llvm-ar'
strip = toolchain / 'llvm-strip'
c_ld = 'lld'
cpp_ld = 'lld'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
